name: Render film
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Film folder name under pip-mentor/src/projects"
        default: "forex-roast-1"
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SLUG: ${{ inputs.slug }}
    defaults:
      run:
        working-directory: pip-mentor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: System packages (ffmpeg + Chrome libraries)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2t64 libatk-bridge2.0-0t64
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Sound effects
        run: bash tools/make_sfx.sh
      - name: QA stills
        run: |
          mkdir -p out
          for fr in 60 100 180 250 300 400 480 545 620 690 760 860 980 1100 1200; do
            npx remotion still src/projects/$SLUG/entry.tsx $SLUG-FILM out/f$fr.png --frame=$fr --scale=0.3 --log=error || true
          done
          ffmpeg -v error -y -pattern_type glob -i 'out/f*.png' -filter_complex "tile=5x3" -frames:v 1 out/${SLUG}_stills.jpg || true
      - name: Render
        run: npx remotion render src/projects/$SLUG/entry.tsx $SLUG-FILM out/raw.mp4 --scale=0.75 --concurrency=2 --log=error
      - name: Normalise loudness
        run: ffmpeg -v error -y -i out/raw.mp4 -c:v copy -af "loudnorm=I=-16:TP=-1.5:LRA=11" -c:a aac -b:a 192k -ar 48000 out/$SLUG.mp4
      - name: Contact sheet
        run: ffmpeg -v error -y -i out/$SLUG.mp4 -vf "fps=1/2,scale=240:-1,tile=6x4" -frames:v 1 out/${SLUG}_sheet.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.slug }}
          path: |
            pip-mentor/out/${{ inputs.slug }}.mp4
            pip-mentor/out/${{ inputs.slug }}_sheet.jpg
            pip-mentor/out/${{ inputs.slug }}_stills.jpg
      - name: Save to repo (videos/ for review)
        working-directory: .
        run: |
          mkdir -p videos
          cp pip-mentor/out/$SLUG.mp4 videos/${SLUG}_v${GITHUB_RUN_NUMBER}.mp4
          cp pip-mentor/out/${SLUG}_sheet.jpg videos/${SLUG}_v${GITHUB_RUN_NUMBER}_sheet.jpg
          cp pip-mentor/out/${SLUG}_stills.jpg videos/${SLUG}_v${GITHUB_RUN_NUMBER}_stills.jpg || true
          git config user.name "claude-renders"
          git config user.email "actions@users.noreply.github.com"
          git add videos
          git commit -m "Render $SLUG v${GITHUB_RUN_NUMBER}"
          git push
